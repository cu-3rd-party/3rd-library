apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: third-library
data:
  RUST_LOG: info
  REDIS_URL: redis://redis:6379/0
  KAFKA_BROKERS: kafka:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: third-library
data:
  DATABASE_URL: postgres://auth:auth@postgres:5432/auth
  KAFKA_BROKERS: kafka:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: statistics-config
  namespace: third-library
data:
  CLICKHOUSE_DSN: clickhouse://clickhouse:9000
  KAFKA_BROKERS: kafka:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: third-library
data:
  MONGODB_URI: mongodb://mongo:27017/notification
  KAFKA_BROKERS: kafka:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: engagement-config
  namespace: third-library
data:
  MONGODB_URI: mongodb://mongo:27017/engagement
  KAFKA_BROKERS: kafka:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: content-config
  namespace: third-library
data:
  MONGODB_URI: mongodb://mongo:27017/content
  KAFKA_BROKERS: kafka:9092
