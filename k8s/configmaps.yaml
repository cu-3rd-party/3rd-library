apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: third-library
data:
  nginx.conf: |-
    events {}
    http {
      upstream gateway {
        server gateway:8080;
      }
      server {
        listen 80;
        location / {
          proxy_pass http://gateway;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: third-library
data:
  RUST_LOG: info
  REDIS_URL: redis://redis:6379/0
  KAFKA_BROKERS: kafka:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: third-library
data:
  DATABASE_URL: postgres://auth:auth@postgres-auth:5432/auth
  KAFKA_BROKERS: kafka:9092
---
apiVersion: v1
