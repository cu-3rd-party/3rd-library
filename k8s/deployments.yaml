apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: third-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
  template:
    metadata:
      labels:
        app: postgres-auth
    spec:
      containers:
        - name: postgres-auth
          image: postgres:16
          envFrom:
            - secretRef:
                name: postgres-auth-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-auth-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-auth-data
          emptyDir: {}
---
