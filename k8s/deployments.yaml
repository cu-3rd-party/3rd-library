apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: third-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 3rd-library-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: third-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 3rd-library-frontend:latest
          ports:
            - containerPort: 5173
