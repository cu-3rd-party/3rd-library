syntax = "proto3";

package engagement.v1;

service EngagementService {
  rpc RecordInteraction(RecordInteractionRequest) returns (RecordInteractionResponse);
  rpc GetEngagement(GetEngagementRequest) returns (GetEngagementResponse);
}

enum InteractionType {
  INTERACTION_TYPE_UNSPECIFIED = 0;
  INTERACTION_TYPE_VIEW = 1;
  INTERACTION_TYPE_DOWNLOAD = 2;
}

message RecordInteractionRequest {
  string content_id = 1;
  string user_id = 2;
  InteractionType type = 3;
  int64 occurred_at = 4;
}

message RecordInteractionResponse {
  string interaction_id = 1;
}

message GetEngagementRequest {
  string content_id = 1;
}

message GetEngagementResponse {
  int64 views = 1;
  int64 downloads = 2;
  int64 unique_users = 3;
}
