syntax = "proto3";

package engagement.v1;

service EngagementService {
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc SetLike(SetLikeRequest) returns (SetLikeResponse);
  rpc GetEngagement(GetEngagementRequest) returns (GetEngagementResponse);
}

message Comment {
  string id = 1;
  string content_id = 2;
  string user_id = 3;
  string body = 4;
  int64 created_at = 5;
}

message AddCommentRequest {
  string content_id = 1;
  string user_id = 2;
  string body = 3;
  int64 created_at = 4;
}

message AddCommentResponse {
  Comment comment = 1;
}

message ListCommentsRequest {
  string content_id = 1;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
}

message SetLikeRequest {
  string content_id = 1;
  string user_id = 2;
  bool liked = 3;
}

message SetLikeResponse {
  int64 likes = 1;
  bool liked = 2;
}

message GetEngagementRequest {
  string content_id = 1;
  string user_id = 2;
}

message GetEngagementResponse {
  int64 likes = 1;
  int64 comments = 2;
  bool liked_by_user = 3;
}
