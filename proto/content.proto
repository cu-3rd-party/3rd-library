syntax = "proto3";

package content.v1;

service ContentService {
  rpc Upload(UploadRequest) returns (UploadResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message Content {
  string id = 1;
  string owner_id = 2;
  string title = 3;
  string description = 4;
  string filename = 5;
  int64 size_bytes = 6;
  int64 created_at = 7;
}

message UploadRequest {
  string owner_id = 1;
  string title = 2;
  string description = 3;
  string filename = 4;
  bytes file_bytes = 5;
}

message UploadResponse {
  Content content = 1;
}

message GetRequest {
  string content_id = 1;
}

message GetResponse {
  Content content = 1;
  bytes file_bytes = 2;
}

message ListRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListResponse {
  repeated Content items = 1;
  string next_page_token = 2;
}
