[workspace]
resolver = "3"
members = ["backend/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
authors = ["Igor Mamaev <igor.mamaev1@gmail.com>"]

[workspace.dependencies]
# слои
library-domain = { path = "backend/crates/domain" }
library-application = { path = "backend/crates/application" }
library-infrastructure = { path = "backend/crates/infrastructure" }
library-migration = { path = "backend/crates/migration" }
library-test-support = { path = "backend/crates/test-support" }

# web
axum = { version = "0.8.8", features = ["macros", "multipart", "tower-log"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
utoipa = { version = "6.0.0", features = ["uuid", "chrono", "preserve_order"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4", features = ["axum"] }

# база данных и внешние сервисы
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "migrate", "macros", "derive"] }
rust-s3 = { version = "0.37.2", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
mail-send = { version = "0.6.0", features = ["logging"] }
rustls = { version = "0.23.40", features = ["aws_lc_rs"] }
rust-embed = "8.11.0"
ammonia = "4.1.2"
prometheus = "0.14.0"

# безопасность
argon2 = "0.5.3"
jwt = "0.16.0"
hmac = "0.12.1"
sha2 = "0.10.9"
rand = "0.8.5"

# общее
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync"] }
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.19.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
regex = "1.12.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# тесты
mockall = "0.15"
dtor = "1"
url = "2"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# ложное срабатывание на каждом `#[async_trait]` в clippy 1.99
double_must_use = "allow"

[profile.release]
lto = "thin"
strip = true
