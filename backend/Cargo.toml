[package]
name = "backend"
version = "0.1.0"
edition = "2024"
publish = false
authors = ["Igor Mamaev <igor.mamaev1@gmail.com>"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
axum = { version = "0.8.8", features = ["tower-log", "multipart"] }
hyper = "1.5.2"
http-body-util = "0.1.3"

[dependencies]
# Core dependencies: runtime, HTTP framework and database client.
futures = "0.3"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8.8", features = ["tower-log", "multipart"] }
sqlx = { version = "0.8.6", features = [
	"runtime-tokio-native-tls",
	"postgres",
	"uuid",
	"time",
] }

serde = { version = "1.0.130", features = ["derive"] }

# State of the art password hashing.
argon2 = "0.5.3"

# Axum builds on the types in Tower
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "cors"] }

jwt = "0.16.0"
hmac = "0.12.1"
sha2 = "0.10.9"

time = "0.3.45"

uuid = { version = "1.19.0", features = ["serde", "v4"] }

# Utility Crates
anyhow = "1.0.48"
rand = "0.8.5"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.14"
thiserror = "2.0.18"
clap = { version = "4.5", features = ["derive", "env"] }
redis = { version = "1.0.3", features = ["tokio-comp", "connection-manager"] }
prometheus = "0.14.0"
once_cell = "1.21.3"
