openapi: 3.0.3
info:
  title: 3rd Library API
  version: 1.0.0
  description: HTTP API for the backend.
servers:
  - url: /
tags:
  - name: Users
  - name: Profiles
  - name: Articles
  - name: Comments
  - name: Attachments
  - name: Tags
paths:
  /api/users:
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserRequest"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/users/login:
    post:
      tags: [Users]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: User logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/user:
    get:
      tags: [Users]
      summary: Get current user
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Users]
      summary: Update current user
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/profiles/{username}:
    get:
      tags: [Profiles]
      summary: Get user profile
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/profiles/{username}/follow:
    post:
      tags: [Profiles]
      summary: Follow user
      parameters:
        - $ref: "#/components/parameters/Username"
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Followed profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Profiles]
      summary: Unfollow user
      parameters:
        - $ref: "#/components/parameters/Username"
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Unfollowed profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/articles:
    get:
      tags: [Articles]
      summary: List articles
      parameters:
        - name: tag
          in: query
          schema:
            type: string
        - name: author
          in: query
          schema:
            type: string
        - name: favorited
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int64
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: Article list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlesResponse"
    post:
      tags: [Articles]
      summary: Create article
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArticleRequest"
      responses:
        "200":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/articles/feed:
    get:
      tags: [Articles]
      summary: List articles from followed users
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int64
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            default: 0
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Article list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/articles/{slug}:
    get:
      tags: [Articles]
      summary: Get article
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Articles]
      summary: Update article
      parameters:
        - $ref: "#/components/parameters/Slug"
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArticleRequest"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Articles]
      summary: Delete article
      parameters:
        - $ref: "#/components/parameters/Slug"
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Article deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/articles/{slug}/favorite:
    post:
      tags: [Articles]
      summary: Favorite article
      parameters:
        - $ref: "#/components/parameters/Slug"
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Favorited article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Articles]
      summary: Unfavorite article
      parameters:
        - $ref: "#/components/parameters/Slug"
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Unfavorited article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/articles/{slug}/comments:
    get:
      tags: [Comments]
      summary: List article comments
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Comment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Comments]
      summary: Add comment to article
      parameters:
        - $ref: "#/components/parameters/Slug"
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCommentRequest"
      responses:
        "200":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/articles/{slug}/comments/{comment_id}:
    delete:
      tags: [Comments]
      summary: Delete comment
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: comment_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Comment deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/articles/{slug}/attachments:
    get:
      tags: [Attachments]
      summary: List article attachments
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Attachment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Attachments]
      summary: Add attachment to article
      parameters:
        - $ref: "#/components/parameters/Slug"
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/articles/{slug}/attachments/{attachment_id}:
    get:
      tags: [Attachments]
      summary: Download attachment
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Attachment file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Attachments]
      summary: Delete attachment
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/AttachmentId"
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Attachment deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tags:
    get:
      tags: [Tags]
      summary: List tags
      responses:
        "200":
          description: Tags list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Use format: Token <jwt>"
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Token
    Forbidden:
      description: Forbidden
    NotFound:
      description: Not found
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorsResponse"
  schemas:
    ErrorsResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [email, token, username, bio, image]
      properties:
        email:
          type: string
          format: email
        token:
          type: string
        username:
          type: string
        bio:
          type: string
        image:
          type: string
          nullable: true
    NewUserRequest:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [username, email, password]
          properties:
            username:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
    LoginUserRequest:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
            password:
              type: string
    UpdateUserRequest:
      type: object
      required: [user]
      properties:
        user:
          type: object
          properties:
            email:
              type: string
              format: email
            username:
              type: string
            password:
              type: string
            bio:
              type: string
            image:
              type: string
              nullable: true
    ProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      required: [username, bio, image, following]
      properties:
        username:
          type: string
        bio:
          type: string
        image:
          type: string
          nullable: true
        following:
          type: boolean
    ArticleResponse:
      type: object
      required: [article]
      properties:
        article:
          $ref: "#/components/schemas/Article"
    ArticlesResponse:
      type: object
      required: [articles, articlesCount]
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        articlesCount:
          type: integer
          format: int64
    Article:
      type: object
      required:
        [
          slug,
          title,
          description,
          body,
          tagList,
          createdAt,
          updatedAt,
          favorited,
          favoritesCount,
          author,
        ]
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        body:
          type: string
        tagList:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        favorited:
          type: boolean
        favoritesCount:
          type: integer
          format: int64
        author:
          $ref: "#/components/schemas/Profile"
    CreateArticleRequest:
      type: object
      required: [article]
      properties:
        article:
          type: object
          required: [title, description, body, tagList]
          properties:
            title:
              type: string
            description:
              type: string
            body:
              type: string
            tagList:
              type: array
              items:
                type: string
    UpdateArticleRequest:
      type: object
      required: [article]
      properties:
        article:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            body:
              type: string
    CommentResponse:
      type: object
      required: [comment]
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
    CommentsResponse:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
    Comment:
      type: object
      required: [id, createdAt, updatedAt, body, author]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        body:
          type: string
        author:
          $ref: "#/components/schemas/Profile"
    AddCommentRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: object
          required: [body]
          properties:
            body:
              type: string
    AttachmentResponse:
      type: object
      required: [attachment]
      properties:
        attachment:
          $ref: "#/components/schemas/Attachment"
    AttachmentsResponse:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    Attachment:
      type: object
      required: [attachmentId, fileName, createdAt, updatedAt]
      properties:
        attachmentId:
          type: string
          format: uuid
        fileName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TagsResponse:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string
