user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 50m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on; 
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    keepalive_timeout 65;
    # Compression: reduces file size by ~70%
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    server {
        listen 80;
        listen 5173;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Security headers
        add_header X-XSS-Protection "1; mode=block" always;  # block page entirely during XSS attack instead of sanitizing it
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;  # can't access camera/microphone/location
        # add_header Content-Security-Policy "\
        #   default-src 'self'; \
        #   script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
        #   style-src 'self' 'unsafe-inline'; \
        #   img-src 'self' data: https:; \
        #   font-src 'self' data:; \
        #   connect-src 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;  # prevents MIME-sniffing
        add_header X-Frame-Options "SAMEORIGIN" always;  # blocks invisible embedding on malicious sites

        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        location = /manifest.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /materials/ {
            proxy_pass http://minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ \.html?$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~ \.(js|css|woff2?|ttf|eot|svg|jpg|jpeg|png|gif|ico|webp)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}

# !IMPORTANT https
