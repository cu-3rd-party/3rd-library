name: tests

on:
  push:
  pull_request:

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run auth tests
        working-directory: backend/auth
        run: go test ./...

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0.0" "pymongo>=4.16.0" "clickhouse-driver>=0.2.10"
      - name: Run content tests
        working-directory: backend/content
        run: python -m pytest
      - name: Run engagement tests
        working-directory: backend/engagement
        run: python -m pytest
      - name: Run notification tests
        working-directory: backend/notification
        run: python -m pytest
      - name: Run statistics tests
        working-directory: backend/statistics
        run: python -m pytest
