name: Backend Unit Tests

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/test-backend-unit.yml"
      - "backend/**"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run backed unit tests
        run: cargo test -p backend --lib
