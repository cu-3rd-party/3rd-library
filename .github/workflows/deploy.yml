name: Deploy

on:
  workflow_dispatch:

#  workflow_run:
#    workflows: [Backend Unit Tests]
#    types: [completed]
#    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH Key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avz --delete --progress docker-compose.prod.yml backend frontend monitoring $SSH_USER@$SSH_HOST:${{ secrets.DEPLOY_PATH }}

      - name: Write env files from secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          DB_ENV: ${{ secrets.DB_ENV }}
          STORAGE_ENV: ${{ secrets.STORAGE_ENV }}
          GRAFANA_ENV: ${{ secrets.GRAFANA_ENV }}
          REDIS_ENV: ${{ secrets.REDIS_ENV }}
        run: |
          ssh $SSH_USER@$SSH_HOST "install -d $DEPLOY_PATH/env"
          ssh $SSH_USER@$SSH_HOST "printf '%s' \"$BACKEND_ENV\" > $DEPLOY_PATH/env/backend.env"
          ssh $SSH_USER@$SSH_HOST "printf '%s' \"$DB_ENV\" > $DEPLOY_PATH/env/db.env"
          ssh $SSH_USER@$SSH_HOST "printf '%s' \"$STORAGE_ENV\" > $DEPLOY_PATH/env/storage.env"
          ssh $SSH_USER@$SSH_HOST "printf '%s' \"$GRAFANA_ENV\" > $DEPLOY_PATH/env/grafana.env"
          ssh $SSH_USER@$SSH_HOST "printf '%s' \"$REDIS_ENV\" > $DEPLOY_PATH/env/redis.env"

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST "cd ${{ secrets.DEPLOY_PATH }} && docker compose -f docker-compose.prod.yml down || true"
          ssh $SSH_USER@$SSH_HOST "cd ${{ secrets.DEPLOY_PATH }} && docker compose -f docker-compose.prod.yml up -d --build"
