version: "3.9"

services:
  gateway:
    build:
      context: ./backend/gateway
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - kafka

  auth:
    build:
      context: ./backend/auth
    environment:
      - DATABASE_URL=postgres://auth:auth@postgres:5432/auth
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - kafka

  statistics:
    build:
      context: ./backend/statistics
    environment:
      - CLICKHOUSE_DSN=clickhouse://clickhouse:9000
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - clickhouse
      - kafka

  notification:
    build:
      context: ./backend/notification
    environment:
      - MONGODB_URI=mongodb://mongo:27017/notification
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongo
      - kafka

  engagement:
    build:
      context: ./backend/engagement
    environment:
      - MONGODB_URI=mongodb://mongo:27017/engagement
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongo
      - kafka

  content:
    build:
      context: ./backend/content
    environment:
      - MONGODB_URI=mongodb://mongo:27017/content
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongo
      - kafka

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=auth
      - POSTGRES_DB=auth
    ports:
      - "5432:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "9000:9000"
      - "8123:8123"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-25-10Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "9001:9001"
      - "9000:9000"
