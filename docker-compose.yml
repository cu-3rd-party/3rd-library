services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./env/backend.env
      - ./env/db.env
      - ./env/redis.env
      - ./env/storage.env
    restart: unless-stopped
    volumes:
      - ./uploads:/var/app/upload
    ports:
      - "8080:8080"
      - "9091:9091"
    depends_on:
      - db
      - redis
      - minio

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

  db:
    image: postgres:16
    env_file:
      - ./env/db.env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d
      - backend-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - backend-redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    env_file:
      - ./env/storage.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - backend-minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    env_file:
      - ./env/grafana.env
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  backend-postgres-data:
  backend-redis-data:
  backend-minio-data:
