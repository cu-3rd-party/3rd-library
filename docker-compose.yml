services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./env/backend.env
      - ./env/db.env
      - ./env/redis.env
    restart: unless-stopped
    volumes:
      - ./uploads:/var/app/upload
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

  db:
    image: postgres:16
    env_file:
      - ./env/db.env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d
      - backend-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - backend-redis-data:/data
    restart: unless-stopped

volumes:
  backend-postgres-data:
  backend-redis-data:
