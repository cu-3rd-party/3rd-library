services:
  gateway:
    build:
      context: ./backend/gateway
    env_file:
      - ./env/gateway.env
    networks:
      - app
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - kafka

  auth:
    build:
      context: ./backend/auth
    env_file:
      - ./env/auth.env
    networks:
      - app
    depends_on:
      - postgres
      - kafka

  statistics:
    build:
      context: ./backend/statistics
    env_file:
      - ./env/statistics.env
    networks:
      - app
    depends_on:
      - clickhouse
      - kafka

  notification:
    build:
      context: ./backend/notification
    env_file:
      - ./env/notification.env
    networks:
      - app
    depends_on:
      - mongo
      - kafka

  engagement:
    build:
      context: ./backend/engagement
    env_file:
      - ./env/engagement.env
    networks:
      - app
    depends_on:
      - mongo
      - kafka

  content:
    build:
      context: ./backend/content
    env_file:
      - ./env/content.env
    networks:
      - app
    depends_on:
      - mongo
      - kafka

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway
    networks:
      - app

  postgres:
    image: postgres:16
    env_file:
      - ./env/postgres.env
    ports:
      - "5432:5432"
    networks:
      - app

  clickhouse:
    image: clickhouse
    ports:
      - "9000:9000"
      - "8123:8123"
    networks:
      - app

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    networks:
      - app

  redis:
    image: redis
    ports:
      - "6379:6379"
    networks:
      - app

  kafka:
    image: apache/kafka:4.1.0
    env_file:
      - ./env/kafka.env
    restart: unless-stopped
    ports:
      - "9092:9092"
    networks:
      - app

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file:
      - ./env/minio.env
    ports:
      - "9001:9001"
      - "9002:9000"
    networks:
      - app

networks:
  app:
