# Локальный запуск: docker compose up -d --build
# Фронтенд — http://localhost:5173, API и Swagger UI — http://localhost:8080/api/docs/swagger-ui,
# Grafana — http://localhost:3000. Прод и dev разворачиваются через self-service (см. README).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./env/backend.env
      - ./env/db.env
      - ./env/storage.env
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9091:9091"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8080
    ports:
      - "5173:8080"
    restart: unless-stopped
    depends_on:
      - backend

  db:
    image: postgres:16
    env_file:
      - ./env/db.env
    ports:
      - "5432:5432"
    volumes:
      - backend-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # S3 как в проде (RustFS); бакет бэкенд создаёт сам
  s3:
    image: rustfs/rustfs:1.0.4
    env_file:
      - ./env/storage.env
    ports:
      - "9000:9000"
    volumes:
      - backend-s3-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    user: "0"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    env_file:
      - ./env/grafana.env
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  backend-postgres-data:
  backend-s3-data:
